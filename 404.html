<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrong stop | Adjie Brotosukmono</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <script>
    /* Addresses from the old Blogger blog that were never single posts.
       Posts themselves still exist at their old paths (see /archive/). */
    (function () {
      var p = location.pathname, m;
      if (/^\/search\/label\//.test(p)) {
        var label = decodeURIComponent(p.split('/')[3] || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return location.replace('/archive/' + (label ? '#' + label : ''));
      }
      if ((m = p.match(/^\/(20\d\d)(?:\/\d\d)?\/?$/))) return location.replace('/archive/#y' + m[1]);
      if (/^\/(search|feeds)(\/|$)/.test(p)) return location.replace('/archive/');
      if (/^\/p\//.test(p)) return location.replace('/about/');
      if (/\.html\/+$/.test(p)) return location.replace(p.replace(/\/+$/, ''));
    })();
    (function () {
      var t = null;
      try { t = localStorage.getItem('www-theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    @font-face { font-family: 'DM Sans'; src: url('/assets/fonts/dm-sans.woff2') format('woff2'); font-weight: 400 800; font-display: swap; }
    @font-face { font-family: 'Caveat'; src: url('/assets/fonts/caveat.woff2') format('woff2'); font-weight: 500 700; font-display: swap; }
    :root { color-scheme: light; --bg-a: #BCD5FF; --bg-b: #F3F7FF; --ink: #14203A; --muted: #4C5B76; --line: #14203A; --card: #fff; --brand: #0052CC; --gold: #B45309; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg-a: #040914; --bg-b: #0F1728; --ink: #EAF1FF; --muted: #A8B6CF; --line: #8DBBFF; --card: #162033; --brand: #8DBBFF; --gold: #FFD28C; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg-a: #040914; --bg-b: #0F1728; --ink: #EAF1FF; --muted: #A8B6CF; --line: #8DBBFF; --card: #162033; --brand: #8DBBFF; --gold: #FFD28C; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; color: var(--ink); background: linear-gradient(180deg, var(--bg-a), var(--bg-b)); font-family: 'DM Sans', system-ui, sans-serif; }
    .hand { font-family: 'Caveat', cursive; font-weight: 600; color: var(--gold); font-size: 1.6rem; margin: 0 auto; max-width: none; transform: rotate(-3deg); }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -.04em; line-height: 1.05; margin: .3rem 0 .8rem; }
    p { color: var(--muted); max-width: 50ch; margin: 0 auto 1.4rem; font-size: 1.05rem; }
    svg { width: min(420px, 88vw); height: auto; margin-bottom: 8px; overflow: hidden; }
    .train { animation: arrive 2.4s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes arrive { from { transform: translateX(-280px); } to { transform: translateX(0); } }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    nav a { padding: .65rem 1.05rem; border-radius: 14px; background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line); text-decoration: none; font-weight: 800; transition: transform .15s, box-shadow .15s; }
    nav a:hover, nav a:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }
    nav a:first-child { background: #FFD28C; color: #14203A; }
    @media (prefers-reduced-motion: reduce) { .train { animation: none; } nav a { transition: none; } }
  </style>
